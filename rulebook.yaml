- name: GitHub Webhook Rulebook
  hosts: localhost
  sources:
    - ansible.eda.webhook:
        token: 44f8be6ec409106d537c76212545ce36f5d62cf7
  rules:
    - name: React to GitHub Push
      condition: event.payload.action == "opened"
      action:
        run_job_template:
          name: vm  # your AAP job template name
          organization: Default
          extra_vars:
            event: "{{ event }}"
